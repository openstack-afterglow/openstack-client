stages: [build]
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
default:
  image: docker:28-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
  services:
    - name: docker:28-dind
      alias: docker
      command: ["--tls=false"]
  interruptible: true
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  HEALTHCHECK_TCP_PORT: "2375"
build-and-test:
  stage: build
  parallel:
    matrix:
      - FLAVOR: slim
        PYTHON_IMAGE: python:3.12-slim-trixie@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      - FLAVOR: alpine
        PYTHON_IMAGE: python:3.12-alpine3.23@sha256:1fd55c2f838c4f76262f9eeed899ff9168ea96ac383c61667d6f204325e1f169
  before_script:
    - docker info
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA-$FLAVOR"
    - docker build --pull --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" --build-arg "VCS_REF=$CI_COMMIT_SHA" --build-arg "SOURCE_URL=$CI_PROJECT_URL" --tag "$IMAGE" .
    - docker run --rm --network none "$IMAGE" openstack-client-check
    - docker run --rm --network none "$IMAGE" /bin/bash --login -c 'openstack --version && test "$(id -u)" = 1000'
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker push "$IMAGE"
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:$FLAVOR"
        docker push "$CI_REGISTRY_IMAGE:$FLAVOR"
        if [ "$FLAVOR" = slim ]; then
          docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
          docker push "$CI_REGISTRY_IMAGE:latest"
        fi
        if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-$FLAVOR"
          docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-$FLAVOR"
        fi
      fi
  timeout: 45m
