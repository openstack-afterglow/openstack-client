stages: [build, test, publish]
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
default:
  interruptible: true

build:
  stage: build
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.28.6-debug@sha256:7ab44d0131c3051b6dea128067e258c7afb5c4815082a93b9cf6c624f2140bf0
    entrypoint: [""]
  parallel:
    matrix:
      - FLAVOR: slim
        PYTHON_IMAGE: python:3.12-slim-trixie@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      - FLAVOR: alpine
        PYTHON_IMAGE: python:3.12-alpine3.23@sha256:1fd55c2f838c4f76262f9eeed899ff9168ea96ac383c61667d6f204325e1f169
  before_script:
    - mkdir -p /kaniko/.docker
    - REGISTRY_AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$REGISTRY_AUTH" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" --build-arg "VCS_REF=$CI_COMMIT_SHA" --build-arg "SOURCE_URL=$CI_PROJECT_URL" --destination "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA-$FLAVOR" --digest-file "$CI_PROJECT_DIR/digest-$FLAVOR.txt" --cache=true --cache-repo "$CI_REGISTRY_IMAGE/cache"
  artifacts:
    paths: ["digest-*.txt"]
    expire_in: 30 days
  timeout: 45m

test:
  stage: test
  image:
    name: $CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA-$FLAVOR
    entrypoint: [""]
  parallel:
    matrix:
      - FLAVOR: [slim, alpine]
  script:
    - openstack-client-check
    - /bin/bash --login -c 'openstack --version && test "$(id -u)" = 1000'
  timeout: 10m

publish:
  stage: publish
  image:
    name: $CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA-slim
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - python scripts/publish.py
  timeout: 10m
